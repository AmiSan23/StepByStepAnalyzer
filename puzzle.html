<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sorting Puzzle Solver</title>
    <link rel="stylesheet" href="style.css">
    <style>
        :root { --primary: #9b59b6; --bg: #f5f6fa; --text: #2f3640; --danger: #e74c3c; --success: #2ecc71; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center; }
        .main-container { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); max-width: 700px; width: 100%; box-sizing: border-box; }
        
        .nav-header { text-align: center; margin-bottom: 15px; border-bottom: 1px solid #eee; padding-bottom: 10px; }
        .nav-header h2 { margin: 0; color: #2c3e50; font-size: 1.1rem; line-height: 1.6;}
        .nav-header a { text-decoration: none; color: #999; margin: 0 5px; transition: 0.2s; }
        .nav-header a.active { color: var(--primary); font-weight: bold; }

        .upload-section { display: flex; gap: 10px; margin-bottom: 15px; }
        .upload-box { flex: 1; border: 2px dashed #ccc; padding: 10px; text-align: center; border-radius: 8px; background: #fafafa; }
        .upload-box input { width: 100%; font-size: 0.75rem; }
        
        .preview-wrapper { display: flex; gap: 10px; margin-bottom: 15px; }
        .canvas-container { flex: 1; position: relative; border: 2px solid #333; border-radius: 4px; overflow: hidden; line-height: 0; background: #000; }
        .canvas-container canvas { width: 100%; display: block; }
        .canvas-label { position: absolute; top: 0; left: 0; background: rgba(0,0,0,0.7); color: white; padding: 2px 6px; font-size: 0.7rem; font-weight: bold; }

        .control-panel { background: #fdfdfd; padding: 15px; border: 1px solid #eee; border-radius: 8px; margin-bottom: 15px; }
        .slider-section { margin-bottom: 15px; border-bottom: 1px dashed #ddd; padding-bottom: 10px; }
        .slider-title { font-size: 0.75rem; font-weight: bold; color: #7f8c8d; text-transform: uppercase; margin-bottom: 10px; display: block; }
        
        .slider-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
        .slider-row label { font-size: 0.8rem; font-weight: bold; color: #555; width: 120px;}
        .val-badge { background: #eee; padding: 2px 6px; border-radius: 4px; font-family: monospace; font-size: 0.75rem; width: 45px; text-align: center;}
        input[type=range] { flex: 1; margin: 0 10px; accent-color: var(--primary); }
        
        .grid-settings { display: flex; gap: 10px; margin-bottom: 10px; }
        .grid-settings select { flex: 1; padding: 8px; border-radius: 4px; border: 1px solid #ccc; font-weight: bold; outline: none; }

        .btn { width: 100%; padding: 12px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 1rem; color: white; transition: 0.2s; margin-top: 5px; }
        .btn-start { background: var(--primary); }
        .btn-start:disabled { background: #bdc3c7; cursor: not-allowed; }
        .btn-download { background: var(--success); display: none; }
        
        .log-box { background: #222; color: #0f0; padding: 10px; font-family: monospace; font-size: 0.8rem; height: 150px; overflow-y: auto; border-radius: 4px; display: none; }
        #status { text-align: center; font-size: 0.85rem; margin: 10px 0; color: #666; font-weight: bold;}
    </style>
    <script async src="https://docs.opencv.org/4.5.4/opencv.js" onload="onOpenCvReady()"></script>
</head>
<body>

<div class="main-container">
    <div class="nav-header">
        <h2>
            <a href="index.html">Pattern V3</a> | 
            <a href="flipimage.html">Flip</a> |
            <a href="difimage.html">Diff</a> | 
            <a href="treasuremap.html">Map</a> |
            <a href="sortpuzzle.html" class="active">Sorting Puzzle</a>
        </h2>
    </div>

    <!-- Upload Gambar -->
    <div class="upload-section">
        <div class="upload-box">
            <span class="slider-title">1. Gambar Target (Asli)</span>
            <input type="file" id="refImage" accept="image/*">
        </div>
        <div class="upload-box">
            <span class="slider-title">2. Gambar Acak (Puzzle)</span>
            <input type="file" id="scrImage" accept="image/*">
        </div>
    </div>

    <!-- Preview -->
    <div class="preview-wrapper">
        <div class="canvas-container">
            <div class="canvas-label">TARGET (ASLI)</div>
            <canvas id="refCanvas"></canvas>
        </div>
        <div class="canvas-container">
            <div class="canvas-label">ACAK (SEKARANG)</div>
            <canvas id="scrCanvas"></canvas>
        </div>
    </div>

    <div class="control-panel">
        <div class="slider-section">
            <span class="slider-title">Pengaturan Grid & Area</span>
            <div class="grid-settings">
                <select id="gridCols">
                    <option value="3">3 Kolom</option>
                    <option value="4" selected>4 Kolom</option>
                    <option value="5">5 Kolom</option>
                </select>
                <select id="gridRows">
                    <option value="3">3 Baris</option>
                    <option value="4">4 Baris</option>
                    <option value="5">5 Baris</option>
                    <option value="6">6 Baris</option>
                </select>
            </div>
            <div class="slider-row">
                <label>TOP MARGIN</label>
                <input type="range" id="marginTop" min="0" max="50" step="0.1" value="15.0">
                <span class="val-badge" id="v-t">15.0%</span>
            </div>
            <div class="slider-row">
                <label>BOTTOM MARGIN</label>
                <input type="range" id="marginBottom" min="0" max="50" step="0.1" value="15.0">
                <span class="val-badge" id="v-b">15.0%</span>
            </div>
            <div class="slider-row">
                <label>SIDE MARGIN</label>
                <input type="range" id="marginSide" min="0" max="30" step="0.1" value="5.0">
                <span class="val-badge" id="v-s">5.0%</span>
            </div>
        </div>
        
        <div class="slider-section">
            <span class="slider-title">Output Resolusi Layar (KeyMapper)</span>
            <div style="display: flex; gap: 10px;">
                <input type="number" id="screenWidth" value="1260" placeholder="Width" style="flex:1; padding: 8px;">
                <input type="number" id="screenHeight" value="2800" placeholder="Height" style="flex:1; padding: 8px;">
            </div>
        </div>

        <button id="processBtn" class="btn btn-start" disabled>🔍 ANALISA & PECAHKAN</button>
        <button id="btnDownload" class="btn btn-download" style="margin-top: 10px;">💾 DOWNLOAD JSON (SWIPE)</button>
    </div>

    <div id="status">Menunggu OpenCV...</div>
    <div class="log-box" id="swapLogs"></div>
</div>


<script>
let cvReady = false;
let refImgObj = new Image();
let scrImgObj = new Image();
let refLoaded = false;
let scrLoaded = false;
let generatedSwaps = []; // Menyimpan urutan swap yang dihasilkan

const refCanvas = document.getElementById('refCanvas');
const scrCanvas = document.getElementById('scrCanvas');
const refCtx = refCanvas.getContext('2d', {willReadFrequently: true});
const scrCtx = scrCanvas.getContext('2d', {willReadFrequently: true});
const logs = document.getElementById('swapLogs');

function onOpenCvReady() {
    cvReady = true;
    document.getElementById('status').innerText = "OpenCV Siap. Upload kedua gambar.";
    checkReady();
}

// PERBAIKAN: Fungsi Muat Gambar 1 (Target/Asli)
document.getElementById('refImage').addEventListener('change', (e) => {
    if (e.target.files && e.target.files[0]) {
        refImgObj.onload = () => {
            refLoaded = true;
            refCanvas.width = refImgObj.naturalWidth;
            refCanvas.height = refImgObj.naturalHeight;
            drawOverlays();
            checkReady();
        };
        refImgObj.src = URL.createObjectURL(e.target.files[0]);
    }
});

// PERBAIKAN: Fungsi Muat Gambar 2 (Acak)
document.getElementById('scrImage').addEventListener('change', (e) => {
    if (e.target.files && e.target.files[0]) {
        scrImgObj.onload = () => {
            scrLoaded = true;
            scrCanvas.width = scrImgObj.naturalWidth;
            scrCanvas.height = scrImgObj.naturalHeight;
            drawOverlays();
            checkReady();
        };
        scrImgObj.src = URL.createObjectURL(e.target.files[0]);
    }
});

function checkReady() {
    if (refLoaded && scrLoaded && cvReady) {
        document.getElementById('processBtn').disabled = false;
        document.getElementById('status').innerText = "Siap untuk memecahkan puzzle!";
    }
}

// Sinkronisasi Slider Margin
['marginTop', 'marginBottom', 'marginSide'].forEach(id => {
    document.getElementById(id).addEventListener('input', (e) => {
        const badgeId = id === 'marginTop' ? 'v-t' : (id === 'marginBottom' ? 'v-b' : 'v-s');
        document.getElementById(badgeId).innerText = parseFloat(e.target.value).toFixed(1) + "%";
        drawOverlays();
    });
});
document.getElementById('gridCols').addEventListener('change', drawOverlays);
document.getElementById('gridRows').addEventListener('change', drawOverlays);

// Menghitung Grid berdasarkan margin
function getGridCells(width, height) {
    const t = parseFloat(document.getElementById('marginTop').value) / 100;
    const b = parseFloat(document.getElementById('marginBottom').value) / 100;
    const s = parseFloat(document.getElementById('marginSide').value) / 100;
    const cols = parseInt(document.getElementById('gridCols').value);
    const rows = parseInt(document.getElementById('gridRows').value);

    const startX = width * s, endX = width * (1 - s);
    const startY = height * t, endY = height * (1 - b);
    const cellW = (endX - startX) / cols;
    const cellH = (endY - startY) / rows;

    let cells = [];
    for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
            let cx = startX + (c * cellW) + (cellW / 2);
            let cy = startY + (r * cellH) + (cellH / 2);
            cells.push({
                x: Math.round(startX + (c * cellW)),
                y: Math.round(startY + (r * cellH)),
                w: Math.round(cellW),
                h: Math.round(cellH),
                cx: Math.round(cx),
                cy: Math.round(cy),
                id: (r * cols) + c
            });
        }
    }
    return cells;
}

// Gambar Grid Overlay
function drawOverlays() {
    if (refLoaded) _drawOnCanvas(refCanvas, refCtx, refImgObj, "rgba(0, 255, 0, 0.5)");
    if (scrLoaded) _drawOnCanvas(scrCanvas, scrCtx, scrImgObj, "rgba(255, 0, 0, 0.5)");
}

function _drawOnCanvas(canvas, ctx, img, color) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(img, 0, 0);
    const cells = getGridCells(canvas.width, canvas.height);
    
    ctx.strokeStyle = color;
    ctx.lineWidth = Math.max(2, canvas.width / 200);
    cells.forEach(c => {
        ctx.strokeRect(c.x, c.y, c.w, c.h);
        ctx.fillStyle = "yellow";
        ctx.beginPath(); ctx.arc(c.cx, c.cy, ctx.lineWidth * 2, 0, Math.PI*2); ctx.fill();
    });
}

// ==========================================
// ALGORITMA PENYELESAIAN (CORE LOGIC)
// ==========================================
document.getElementById('processBtn').onclick = () => {
    document.getElementById('status').innerText = "Sedang mencocokkan gambar... Mohon tunggu.";
    document.getElementById('processBtn').disabled = true;
    logs.innerHTML = ''; 
    logs.style.display = 'block';
    
    setTimeout(() => {
        try {
            const cells = getGridCells(refCanvas.width, refCanvas.height);
            let refMats = [], scrMats = [];
            
            let refSrc = cv.imread(refCanvas);
            let scrSrc = cv.imread(scrCanvas);
            let refGray = new cv.Mat(), scrGray = new cv.Mat();
            cv.cvtColor(refSrc, refGray, cv.COLOR_RGBA2GRAY);
            cv.cvtColor(scrSrc, scrGray, cv.COLOR_RGBA2GRAY);

            // Ekstrak & Resize 50x50 piksel
            cells.forEach(c => {
                const innerX = c.x + c.w * 0.2;
                const innerY = c.y + c.h * 0.2;
                const innerW = c.w * 0.6;
                const innerH = c.h * 0.6;
                let rect = new cv.Rect(innerX, innerY, innerW, innerH);
                
                let rRoi = refGray.roi(rect);
                let sRoi = scrGray.roi(rect);
                
                let rResized = new cv.Mat();
                let sResized = new cv.Mat();
                
                cv.resize(rRoi, rResized, new cv.Size(50, 50));
                cv.resize(sRoi, sResized, new cv.Size(50, 50));

                refMats.push(rResized);
                scrMats.push(sResized);
                
                rRoi.delete(); sRoi.delete();
            });

            // --- PERBAIKAN: MATRIKS PENCOCOKAN UNIK (1-TO-1 MAPPING) ---
            let scores = [];
            for (let s = 0; s < scrMats.length; s++) {
                for (let r = 0; r < refMats.length; r++) {
                    let diff = new cv.Mat();
                    cv.absdiff(scrMats[s], refMats[r], diff);
                    cv.threshold(diff, diff, 35, 255, cv.THRESH_BINARY);
                    let score = cv.countNonZero(diff); 
                    diff.delete();
                    
                    scores.push({ scrIdx: s, refIdx: r, diff: score });
                }
            }

            // Urutkan dari tingkat kemiripan paling tinggi (diff terkecil)
            scores.sort((a, b) => a.diff - b.diff);

            // Array identitas akhir
            let currentState = new Array(scrMats.length).fill(-1);
            let usedScr = new Set();
            let usedRef = new Set();

            for (let i = 0; i < scores.length; i++) {
                let match = scores[i];
                // Jika identitas potongan belum dikunci, maka kunci (Mencegah ganda)
                if (!usedScr.has(match.scrIdx) && !usedRef.has(match.refIdx)) {
                    currentState[match.scrIdx] = match.refIdx;
                    usedScr.add(match.scrIdx);
                    usedRef.add(match.refIdx);
                }
            }
            // --- AKHIR PERBAIKAN ---

            refSrc.delete(); scrSrc.delete(); refGray.delete(); scrGray.delete();
            refMats.forEach(m => m.delete()); scrMats.forEach(m => m.delete());

            // Validasi jika ada yang gagal terpetakan (biasanya karena margin salah/garis grid ikut terdeteksi)
            if (currentState.includes(-1)) {
                throw new Error("Gagal mengunci identitas unik. Harap atur ulang margin.");
            }

            // Siklus Pertukaran (Swapping Logic)
            generatedSwaps = [];
            let state = [...currentState];
            let stepCount = 1;

            for (let i = 0; i < state.length; i++) {
                while (state[i] !== i) {
                    let correctPos = state[i]; 
                    let targetContent = state[correctPos]; // Gambar yg menduduki tempat tujuan saat ini

                    generatedSwaps.push({ from: i, to: correctPos });
                    
                    // Laporan Log diperjelas dengan Identitas Ganda
                    logMsg(`Step ${stepCount}: Sel ${i} (Gbr ${state[i]}) ➔ Sel ${correctPos}`);
                    logMsg(`&nbsp;&nbsp;&nbsp;↳ <i>Info: Gbr ${targetContent} dari Sel ${correctPos} terlempar ke Sel ${i}</i>`);
                    stepCount++;
                    
                    // Tukar
                    let temp = state[i];
                    state[i] = state[correctPos];
                    state[correctPos] = temp;
                }
            }

            if (generatedSwaps.length === 0) {
                logMsg("Puzzle sudah tersusun dengan benar!");
            } else {
                logMsg(`<br><b>[SELESAI] Total langkah: ${generatedSwaps.length}</b>`);
                document.getElementById('btnDownload').style.display = 'block';
            }
            document.getElementById('status').innerText = "Proses selesai!";
            
        } catch (err) {
            console.error("System Error:", err);
            document.getElementById('status').innerText = "Terjadi kesalahan sistem.";
            logMsg(`<span style="color:#e74c3c">ERROR: ${err.message}</span>`);
        } finally {
            document.getElementById('processBtn').disabled = false;
        }
    }, 150); 
};

function logMsg(msg) {
    logs.innerHTML += `<div>${msg}</div>`;
    logs.scrollTop = logs.scrollHeight;
}

// ==========================================
// OUTPUT JSON KEYMAPPER
// ==========================================
document.getElementById('btnDownload').onclick = () => {
    if (generatedSwaps.length === 0) return;

    const targetW = parseFloat(document.getElementById('screenWidth').value) || 1260;
    const targetH = parseFloat(document.getElementById('screenHeight').value) || 2800;
    
    const scaleX = targetW / refCanvas.width;
    const scaleY = targetH / refCanvas.height;

    const cells = getGridCells(refCanvas.width, refCanvas.height);

    const actionList = generatedSwaps.map((swap, index) => {
        let startCell = cells[swap.from];
        let endCell = cells[swap.to];

        let startX = Math.round(startCell.cx * scaleX);
        let startY = Math.round(startCell.cy * scaleY);
        let endX = Math.round(endCell.cx * scaleX);
        let endY = Math.round(endCell.cy * scaleY);

        return {
            "data": `${startX},${startY},${endX},${endY},1,200`,
            "extras": [
                { "data": `Swap ${swap.from} to ${swap.to}`, "id": "extra_coordinate_description" },
                { "data": 250, "id": "extra_delay_before_next_action" } 
            ],
            "flags": 0,
            "type": "SWIPE_COORDINATE",
            "uid": crypto.randomUUID()
        };
    });

    const keymapData = {
        "app_version": 63,
        "keymap_db_version": 13,
        "fingerprint_map_list": [
            { "action_list": [], "constraints": [], "constraint_mode": 1, "extras": [], "flags": 0, "id": 0, "enabled": true },
            { "action_list": [], "constraints": [], "constraint_mode": 1, "extras": [], "flags": 0, "id": 1, "enabled": true },
            { "action_list": [], "constraints": [], "constraint_mode": 1, "extras": [], "flags": 0, "id": 2, "enabled": true },
            { "action_list": [], "constraints": [], "constraint_mode": 1, "extras": [], "flags": 0, "id": 3, "enabled": true }
        ],
        "keymap_list": [{
            "actionList": actionList,
            "constraintList": [],
            "constraintMode": 1,
            "flags": 0,
            "id": 27,
            "isEnabled": true,
            "trigger": {
                "extras": [],
                "flags": 1,
                "keys": [{
                    "clickType": 2, 
                    "deviceId": "io.github.sds100.keymapper.THIS_DEVICE",
                    "flags": 0,
                    "keyCode": 24, 
                    "uid": crypto.randomUUID()
                }],
                "mode": 2
            },
            "uid": crypto.randomUUID()
        }]
    };

    const blob = new Blob([JSON.stringify(keymapData)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    const timestamp = new Date().toISOString().replace(/T/, '_').replace(/\..+/, '').replace(/:/g, '');
    a.download = `Sorting_Puzzle_${timestamp}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
};
</script>

</body>
</html>
